<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Papi 🏍️</title>
    <style>
        :root {
            --bg-color: #050505; /* Fondo Negro profundo */
            --card-bg: #ffffff; /* Tarjetas Blancas */
            --primary: #d32f2f; /* Rojo intenso */
            --text-dark: #121212; /* Texto oscuro */
            --text-light: #ffffff; /* Texto claro */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-dark);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.2);
            margin-bottom: 20px;
        }

        .bg-highlight {
            border: 3px solid var(--primary);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            text-transform: uppercase;
            font-size: 1.3rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }
        
        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
        }

        .gastos-title {
            margin-top: 25px;
            color: var(--primary);
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: var(--text-light);
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-submit:active {
            background-color: #b71c1c;
            transform: translateY(2px);
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            text-align: center;
        }

        .stats-grid p {
            margin: 5px 0;
            font-weight: bold;
            color: #555;
        }

        .stats-grid h3 {
            margin: 0;
            font-size: 1.8rem;
        }

        .text-red { color: var(--primary); }
        .text-green { color: #2e7d32; }

        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
        }
        
        .stats-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moto Papi 🏍️</h1>
        
        <!-- Formulario -->
        <form id="jornadaForm" class="card">
            <h2>Registrar Día</h2>
            
            <label>Fecha:</label>
            <input type="date" id="fecha" required>

            <div class="row">
                <div class="col">
                    <label>Hora Inicio:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div class="col">
                    <label>Hora Fin:</label>
                    <input type="time" id="horaFin" required>
                </div>
            </div>

            <label>Total de Carreras:</label>
            <input type="number" id="carreras" placeholder="Ej. 15" required min="1">

            <label>Ingreso Total (Bruto $):</label>
            <input type="number" id="ingresos" step="0.01" placeholder="Ej. 50.00" required min="0">

            <h3 class="gastos-title">Gastos del Día</h3>
            <div class="row">
                <div class="col">
                    <label>Gasolina ($):</label>
                    <input type="number" id="gasolina" step="0.01" value="0" min="0">
                </div>
                <div class="col">
                    <label>Comida ($):</label>
                    <input type="number" id="comida" step="0.01" value="0" min="0">
                </div>
                <div class="col">
                    <label>Otros ($):</label>
                    <input type="number" id="otros" step="0.01" value="0" min="0">
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar Jornada</button>
        </form>

        <!-- Resumen Rápido -->
        <div class="card bg-highlight">
            <h2>Último Registro</h2>
            <div class="stats-grid">
                <div>
                    <p>Ganancia Neta</p>
                    <h3 id="resumenNeta" class="text-green">$0.00</h3>
                </div>
                <div>
                    <p>Gastos Totales</p>
                    <h3 id="resumenGastos" class="text-red">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="card">
            <h2>Rendimiento</h2>
            <ul class="stats-list">
                <li><strong>Mejor día:</strong> <span id="mejorDia" class="text-red">-</span></li>
                <li><strong>Mejor hora de inicio:</strong> <span id="mejorHorario" class="text-red">-</span></li>
                <li><strong>Total carreras:</strong> <span id="totalCarreras">0</span></li>
                <li><strong>Ganancia Neta Total:</strong> <span id="gananciaTotal" class="text-green">$0.00</span></li>
            </ul>
        </div>
    </div>

    <script>
        document.getElementById('fecha').valueAsDate = new Date();

        let registros = JSON.parse(localStorage.getItem('motopapi_data')) || [];

        document.getElementById('jornadaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fecha = document.getElementById('fecha').value;
            const horaInicio = document.getElementById('horaInicio').value;
            const horaFin = document.getElementById('horaFin').value;
            const carreras = parseInt(document.getElementById('carreras').value);
            const ingresos = parseFloat(document.getElementById('ingresos').value);
            
            const gasolina = parseFloat(document.getElementById('gasolina').value) || 0;
            const comida = parseFloat(document.getElementById('comida').value) || 0;
            const otros = parseFloat(document.getElementById('otros').value) || 0;

            const totalGastos = gasolina + comida + otros;
            const gananciaNeta = ingresos - totalGastos;
            
            const fechaObj = new Date(fecha + 'T00:00:00');
            const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const diaNombre = diasSemana[fechaObj.getDay()];

            const nuevaJornada = {
                fecha, diaNombre, horaInicio, horaFin, carreras, ingresos,
                gastos: { gasolina, comida, otros, total: totalGastos },
                gananciaNeta
            };

            registros.push(nuevaJornada);
            localStorage.setItem('motopapi_data', JSON.stringify(registros));

            actualizarInterfaz(nuevaJornada);
            alert('¡Jornada guardada con éxito en Moto Papi!');
            
            // Limpiar datos para el siguiente día, conservando la fecha actual
            document.getElementById('carreras').value = '';
            document.getElementById('ingresos').value = '';
            document.getElementById('gasolina').value = '0';
            document.getElementById('comida').value = '0';
            document.getElementById('otros').value = '0';
            document.getElementById('fecha').valueAsDate = new Date(); 
        });

        function actualizarInterfaz(ultimaJornada = null) {
            if (registros.length === 0) return;

            if (ultimaJornada) {
                document.getElementById('resumenNeta').innerText = `$${ultimaJornada.gananciaNeta.toFixed(2)}`;
                document.getElementById('resumenGastos').innerText = `$${ultimaJornada.gastos.total.toFixed(2)}`;
            }

            let totalCarrerasHist = 0;
            let gananciaNetaHist = 0;
            let gananciasPorDia = {}; 
            let gananciasPorHora = {};

            registros.forEach(reg => {
                totalCarrerasHist += reg.carreras;
                gananciaNetaHist += reg.gananciaNeta;

                // Encontrar mejor día
                if (!gananciasPorDia[reg.diaNombre]) gananciasPorDia[reg.diaNombre] = 0;
                gananciasPorDia[reg.diaNombre] += reg.gananciaNeta;

                // Encontrar mejor horario (tomamos solo la hora, ej. de 08:30 toma "08:00")
                let horaCorta = reg.horaInicio.split(':')[0] + ":00";
                if (!gananciasPorHora[horaCorta]) gananciasPorHora[horaCorta] = 0;
                gananciasPorHora[horaCorta] += reg.gananciaNeta;
            });

            document.getElementById('totalCarreras').innerText = totalCarrerasHist;
            document.getElementById('gananciaTotal').innerText = `$${gananciaNetaHist.toFixed(2)}`;

            let mejorDia = '-';
            let maxGananciaDia = 0;
            for (const dia in gananciasPorDia) {
                if (gananciasPorDia[dia] > maxGananciaDia) {
                    maxGananciaDia = gananciasPorDia[dia];
                    mejorDia = dia;
                }
            }
            document.getElementById('mejorDia').innerText = mejorDia;

            let mejorHorario = '-';
            let maxGananciaHora = 0;
            for (const hora in gananciasPorHora) {
                if (gananciasPorHora[hora] > maxGananciaHora) {
                    maxGananciaHora = gananciasPorHora[hora];
                    mejorHorario = hora;
                }
            }
            document.getElementById('mejorHorario').innerText = mejorHorario;
        }

        window.onload = function() {
            if(registros.length > 0) {
                actualizarInterfaz(registros[registros.length - 1]); 
            }
        };
    </script>
</body>
</html>
