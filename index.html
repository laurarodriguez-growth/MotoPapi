<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Papi 🏍️</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #ffffff;
            --primary: #d32f2f;
            --text-dark: #121212;
            --text-light: #ffffff;
            --green: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .greeting {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-dark);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.2);
            margin-bottom: 15px;
        }

        .bg-highlight {
            border: 3px solid var(--primary);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-transform: uppercase;
            font-size: 1.1rem;
            text-align: center;
        }

        /* Estructura lado a lado para los formularios */
        .forms-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .form-half {
            flex: 1;
            padding: 12px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            color: var(--text-light);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-green { background-color: var(--green); }
        .btn-green:active { background-color: #1b5e20; transform: translateY(2px); }

        .btn-red { background-color: var(--primary); }
        .btn-red:active { background-color: #b71c1c; transform: translateY(2px); }

        /* Dashboard */
        .stats-grid {
            display: flex;
            justify-content: space-between;
            text-align: center;
        }

        .stats-grid p {
            margin: 5px 0;
            font-weight: bold;
            color: #555;
            font-size: 0.9rem;
        }

        .stats-grid h3 {
            margin: 0;
            font-size: 2rem;
        }

        .text-red { color: var(--primary); }
        .text-green { color: var(--green); }

        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
        }
        
        .stats-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moto Papi 🏍️</h1>
        <p class="greeting">Hola! Moto Papi Maikol ♥</p>

        <!-- Dashboard movido arriba -->
        <div class="card bg-highlight">
            <h2 style="border-color: var(--primary); color: var(--primary);">Hoy</h2>
            <div class="stats-grid">
                <div>
                    <p>Ganancia Neta</p>
                    <h3 id="resumenNeta" class="text-green">$0.00</h3>
                </div>
                <div>
                    <p>Gastos</p>
                    <h3 id="resumenGastos" class="text-red">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Formularios Lado a Lado -->
        <div class="forms-wrapper">
            <!-- Formulario Ingreso -->
            <form id="ingresoForm" class="card form-half">
                <h2>Ingreso</h2>
                <label>Pago de Carrera ($):</label>
                <input type="number" id="montoIngreso" step="0.01" placeholder="Ej. 3.50" required min="0.01">
                <button type="submit" class="btn-submit btn-green">Guardar</button>
            </form>

            <!-- Formulario Gasto -->
            <form id="gastoForm" class="card form-half">
                <h2>Gasto</h2>
                <label>Categoría:</label>
                <select id="categoriaGasto">
                    <option value="Gasolina">⛽ Gasolina</option>
                    <option value="Comida">🍔 Comida</option>
                    <option value="Otros">🔧 Otros</option>
                </select>
                <label>Monto ($):</label>
                <input type="number" id="montoGasto" step="0.01" placeholder="Ej. 5.00" required min="0.01">
                <button type="submit" class="btn-submit btn-red">Guardar</button>
            </form>
        </div>

        <!-- Estadísticas -->
        <div class="card">
            <h2>Rendimiento Histórico</h2>
            <ul class="stats-list">
                <li><strong>Mejor día:</strong> <span id="mejorDia" class="text-red">-</span></li>
                <li><strong>Mejor hora:</strong> <span id="mejorHorario" class="text-red">-</span></li>
                <li><strong>Total carreras:</strong> <span id="totalCarreras">0</span></li>
                <li><strong>Ganancia Neta Total:</strong> <span id="gananciaTotal" class="text-green">$0.00</span></li>
            </ul>
        </div>
    </div>

    <script>
        // Usamos una nueva llave para no mezclar con la versión anterior de días completos
        let movimientos = JSON.parse(localStorage.getItem('motopapi_datos_carreras')) || [];

        // Guardar Ingreso (Carrera)
        document.getElementById('ingresoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('montoIngreso').value);
            const now = new Date();
            
            movimientos.push({
                tipo: 'ingreso',
                monto: monto,
                fechaStr: now.toDateString(), // Ej: "Fri Sep 04 2026"
                diaSemana: now.getDay(), // 0 a 6
                horaCorta: now.getHours() + ":00" // Ej: "14:00"
            });
            
            guardarDatos();
            this.reset();
        });

        // Guardar Gasto
        document.getElementById('gastoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('montoGasto').value);
            const now = new Date();
            
            movimientos.push({
                tipo: 'gasto',
                monto: monto,
                fechaStr: now.toDateString()
            });
            
            guardarDatos();
            this.reset();
        });

        function guardarDatos() {
            localStorage.setItem('motopapi_datos_carreras', JSON.stringify(movimientos));
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const todayStr = new Date().toDateString();
            
            let netaHoy = 0;
            let gastosHoy = 0;
            let totalCarrerasHist = 0;
            let netaHist = 0;
            
            let ingresosPorDia = {};
            let ingresosPorHora = {};
            const nombresDias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

            movimientos.forEach(mov => {
                if (mov.tipo === 'ingreso') {
                    totalCarrerasHist++;
                    netaHist += mov.monto;
                    if (mov.fechaStr === todayStr) netaHoy += mov.monto;

                    // Para estadísticas
                    const nombreDia = nombresDias[mov.diaSemana];
                    if (!ingresosPorDia[nombreDia]) ingresosPorDia[nombreDia] = 0;
                    ingresosPorDia[nombreDia] += mov.monto;

                    if (!ingresosPorHora[mov.horaCorta]) ingresosPorHora[mov.horaCorta] = 0;
                    ingresosPorHora[mov.horaCorta] += mov.monto;

                } else if (mov.tipo === 'gasto') {
                    netaHist -= mov.monto;
                    if (mov.fechaStr === todayStr) {
                        gastosHoy += mov.monto;
                        netaHoy -= mov.monto;
                    }
                }
            });

            // Actualizar Dashboard de HOY
            document.getElementById('resumenNeta').innerText = `$${netaHoy.toFixed(2)}`;
            document.getElementById('resumenGastos').innerText = `$${gastosHoy.toFixed(2)}`;

            // Actualizar Histórico
            document.getElementById('totalCarreras').innerText = totalCarrerasHist;
            document.getElementById('gananciaTotal').innerText = `$${netaHist.toFixed(2)}`;

            let mejorDia = '-', maxDia = 0;
            for (let d in ingresosPorDia) {
                if (ingresosPorDia[d] > maxDia) { maxDia = ingresosPorDia[d]; mejorDia = d; }
            }
            
            let mejorHora = '-', maxHora = 0;
            for (let h in ingresosPorHora) {
                if (ingresosPorHora[h] > maxHora) { maxHora = ingresosPorHora[h]; mejorHora = h; }
            }

            document.getElementById('mejorDia').innerText = mejorDia;
            document.getElementById('mejorHorario').innerText = mejorHora;
        }

        // Cargar datos al abrir
        window.onload = actualizarInterfaz;
    </script>
</body>
</html>
