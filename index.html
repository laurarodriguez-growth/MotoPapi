<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Papi 🏍️</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #ffffff;
            --primary: #d32f2f;
            --text-dark: #121212;
            --text-light: #ffffff;
            --green: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .greeting {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-dark);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.2);
            margin-bottom: 15px;
        }

        .bg-highlight {
            border: 3px solid var(--primary);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-transform: uppercase;
            font-size: 1.1rem;
            text-align: center;
        }

        .forms-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .form-half {
            flex: 1;
            padding: 12px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-align: center;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* Botones de acceso rápido */
        .quick-amounts {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .btn-quick {
            flex: 1;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 2px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .btn-quick:active {
            background-color: #d32f2f;
            color: white;
            border-color: #d32f2f;
        }

        .btn-submit {
            width: 100%;
            color: var(--text-light);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-green { background-color: var(--green); }
        .btn-green:active { background-color: #1b5e20; transform: translateY(2px); }

        .btn-red { background-color: var(--primary); }
        .btn-red:active { background-color: #b71c1c; transform: translateY(2px); }

        /* Pestañas de reportes separados */
        .report-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background-color: #f0f0f0;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            text-align: center;
        }

        .stats-grid p {
            margin: 5px 0;
            font-weight: bold;
            color: #555;
            font-size: 0.9rem;
        }

        .stats-grid h3 {
            margin: 0;
            font-size: 1.8rem;
        }

        .text-red { color: var(--primary); }
        .text-green { color: var(--green); }

        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stats-list li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
        }
        
        .stats-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moto Papi 🏍️</h1>
        <p class="greeting">Hola! Moto Papi Maikol ♥</p>

        <!-- Dashboard de HOY -->
        <div class="card bg-highlight">
            <h2 style="border-color: var(--primary); color: var(--primary);">Hoy</h2>
            <div class="stats-grid">
                <div>
                    <p>Ganancia Neta</p>
                    <h3 id="resumenNeta" class="text-green">$0.00</h3>
                </div>
                <div>
                    <p>Gastos</p>
                    <h3 id="resumenGastos" class="text-red">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Formularios Lado a Lado -->
        <div class="forms-wrapper">
            <!-- Formulario Ingreso -->
            <form id="ingresoForm" class="card form-half">
                <h2>Ingreso</h2>
                <label>Pago ($):</label>
                <div class="quick-amounts">
                    <button type="button" class="btn-quick" onclick="setMonto(3)">$3</button>
                    <button type="button" class="btn-quick" onclick="setMonto(4)">$4</button>
                    <button type="button" class="btn-quick" onclick="setMonto(5)">$5</button>
                    <button type="button" class="btn-quick" onclick="setMonto(10)">$10</button>
                </div>
                <input type="number" id="montoIngreso" step="0.01" placeholder="Ej. 3.50" required min="0.01">
                <button type="submit" class="btn-submit btn-green">Guardar</button>
            </form>

            <!-- Formulario Gasto -->
            <form id="gastoForm" class="card form-half">
                <h2>Gasto</h2>
                <label>Categoría:</label>
                <select id="categoriaGasto">
                    <option value="Gasolina">⛽ Gasolina</option>
                    <option value="Comida">🍔 Comida</option>
                    <option value="Otros">🔧 Otros</option>
                </select>
                <label>Monto ($):</label>
                <input type="number" id="montoGasto" step="0.01" placeholder="Ej. 5.00" required min="0.01">
                <button type="submit" class="btn-submit btn-red">Guardar</button>
            </form>
        </div>

        <!-- Dashboard Separado: Reportes de Semana / Mes -->
        <div class="card">
            <h2>Reportes y Rendimiento</h2>
            
            <div class="report-tabs">
                <button class="tab-btn active" id="btnSemana" onclick="cambiarVista('semana')">Esta Semana</button>
                <button class="tab-btn" id="btnMes" onclick="cambiarVista('mes')">Este Mes</button>
            </div>

            <div class="stats-grid" style="margin-bottom: 15px;">
                <div>
                    <p id="tituloReporteNeto">Ganancia Neta Semanal</p>
                    <h3 id="reporteNeta" class="text-green">$0.00</h3>
                </div>
                <div>
                    <p>Gastos</p>
                    <h3 id="reporteGastos" class="text-red">$0.00</h3>
                </div>
            </div>

            <ul class="stats-list">
                <li><strong>Mejor día:</strong> <span id="mejorDia" class="text-red">-</span></li>
                <li><strong>Mejor hora:</strong> <span id="mejorHorario" class="text-red">-</span></li>
                <li><strong>Total carreras:</strong> <span id="totalCarrerasReporte">0</span></li>
            </ul>
        </div>
    </div>

    <script>
        let movimientos = JSON.parse(localStorage.getItem('motopapi_datos_carreras')) || [];
        let vistaActual = 'semana'; // 'semana' o 'mes'

        function setMonto(valor) {
            document.getElementById('montoIngreso').value = valor;
        }

        function cambiarVista(vista) {
            vistaActual = vista;
            document.getElementById('btnSemana').classList.toggle('active', vista === 'semana');
            document.getElementById('btnMes').classList.toggle('active', vista === 'mes');
            document.getElementById('tituloReporteNeto').innerText = vista === 'semana' ? 'Ganancia Neta Semanal' : 'Ganancia Neta Mensual';
            actualizarInterfaz();
        }

        document.getElementById('ingresoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('montoIngreso').value);
            const now = new Date();
            
            movimientos.push({
                tipo: 'ingreso',
                monto: monto,
                fechaIso: now.toISOString(), // Guardamos formato fecha estándar para calcular semanas/meses fácilmente
                fechaStr: now.toDateString(),
                diaSemana: now.getDay(),
                horaCorta: now.getHours() + ":00"
            });
            
            guardarDatos();
            this.reset();
        });

        document.getElementById('gastoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('montoGasto').value);
            const now = new Date();
            
            movimientos.push({
                tipo: 'gasto',
                monto: monto,
                fechaIso: now.toISOString(),
                fechaStr: now.toDateString()
            });
            
            guardarDatos();
            this.reset();
        });

        guardarDatos = function() {
            localStorage.setItem('motopapi_datos_carreras', JSON.stringify(movimientos));
            actualizarInterfaz();
        }

        // Funciones auxiliares para fechas
        function mismaSemana(fecha1, fecha2) {
            const d1 = new Date(fecha1);
            const d2 = new Date(fecha2);
            // Aislar el inicio de semana (lunes)
            const getMonday = (d) => {
                d = new Date(d);
                let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(d.setDate(diff)).setHours(0,0,0,0);
            };
            return getMonday(d1) === getMonday(d2);
        }

        function mismoMes(fecha1, fecha2) {
            const d1 = new Date(fecha1);
            const d2 = new Date(fecha2);
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
        }

        function actualizarInterfaz() {
            const nowIso = new Date().toISOString();
            const todayStr = new Date().toDateString();
            
            let netaHoy = 0, gastosHoy = 0;
            let reporteNetaVal = 0, reporteGastosVal = 0, reporteCarrerasVal = 0;
            
            let ingresosPorDia = {};
            let ingresosPorHora = {};
            const nombresDias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

            movimientos.forEach(mov => {
                // Compatibilidad con registros viejos sin fechaIso
                const fechaMov = mov.fechaIso || new Date().toISOString();

                // Datos de Hoy
                if (mov.tipo === 'ingreso') {
                    if (mov.fechaStr === todayStr) netaHoy += mov.monto;
                } else if (mov.tipo === 'gasto') {
                    if (mov.fechaStr === todayStr) {
                        gastosHoy += mov.monto;
                        netaHoy -= mov.monto;
                    }
                }

                // Filtrar según la pestaña seleccionada (Semana o Mes)
                let cumpleFiltro = false;
                if (vistaActual === 'semana') {
                    cumpleFiltro = mismaSemana(fechaMov, nowIso);
                } else {
                    cumpleFiltro = mismoMes(fechaMov, nowIso);
                }

                if (cumpleFiltro) {
                    if (mov.tipo === 'ingreso') {
                        reporteNetaVal += mov.monto;
                        reporteCarrerasVal++;

                        // Estadísticas del periodo
                        const dIndex = new Date(fechaMov).getDay();
                        const nombreDia = nombresDias[dIndex];
                        if (!ingresosPorDia[nombreDia]) ingresosPorDia[nombreDia] = 0;
                        ingresosPorDia[nombreDia] += mov.monto;

                        const hCorta = new Date(fechaMov).getHours() + ":00";
                        if (!ingresosPorHora[hCorta]) ingresosPorHora[hCorta] = 0;
                        ingresosPorHora[hCorta] += mov.monto;

                    } else if (mov.tipo === 'gasto') {
                        reporteGastosVal += mov.monto;
                        reporteNetaVal -= mov.monto;
                    }
                }
            });

            // Pintar Dashboard HOY
            document.getElementById('resumenNeta').innerText = `$${netaHoy.toFixed(2)}`;
            document.getElementById('resumenGastos').innerText = `$${gastosHoy.toFixed(2)}`;

            // Pintar Reportes (Semana/Mes)
            document.getElementById('reporteNeta').innerText = `$${reporteNetaVal.toFixed(2)}`;
            document.getElementById('reporteGastos').innerText = `$${reporteGastosVal.toFixed(2)}`;
            document.getElementById('totalCarrerasReporte').innerText = reporteCarrerasVal;

            let mejorDia = '-', maxDia = 0;
            for (let d in ingresosPorDia) {
                if (ingresosPorDia[d] > maxDia) { maxDia = ingresosPorDia[d]; mejorDia = d; }
            }
            
            let mejorHora = '-', maxHora = 0;
            for (let h in ingresosPorHora) {
                if (ingresosPorHora[h] > maxHora) { maxHora = ingresosPorHora[h]; mejorHora = h; }
            }

            document.getElementById('mejorDia').innerText = mejorDia;
            document.getElementById('mejorHorario').innerText = mejorHora;
        }

        window.onload = actualizarInterfaz;
    </script>
</body>
</html>
